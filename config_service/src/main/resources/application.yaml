server:
  port: 8070

management:
  endpoints:
    web:
      exposure:
        include: "*"
  health:
    readinessstate:
      enabled: true
    livenessstate:
      enabled: true
  endpoint:
    health:
      probes:
        enabled: true

encrypt:
  key: "wWZdqKXJu6rwnDo69H7W8hNRCYTB2YzL"

spring:
  application:
    name: config_service

  profiles:
    active: git
  cloud:
    config:
      server:
        git:
          uri:
          default-label: master
          timeout: 5
          clone-on-start: true
          force-pull: true