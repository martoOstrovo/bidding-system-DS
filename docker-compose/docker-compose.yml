services:
  redis:
    image: redis
    container_name: redis-ratelimit-ms
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      timeout: 10s
      retries: 10
    volumes:
      - redis-data:/data
    extends:
      file: common-config.yml
      service: network-deploy-service

  config-service:
    image: martogr/config_service:v1
    container_name: config-service-ms
    ports:
      - "8070:8070"
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  eureka-service:
    image: martogr/eureka_service:v1
    container_name: eureka-service-ms
    ports:
      - "8071:8071"
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "eureka_service"
    extends:
      file: common-config.yml
      service: microservice-config-service-config


  bidding-service:
    image: martogr/bidding_service:v1
    container_name: bidding-ms
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
#      rabbit:
#        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "bidding_service"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  item-service:
    image: martogr/item_service:v1
    container_name: item-ms
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "item_service"
    extends:
      file: common-config.yml
      service: microservice-eureka-config


  mail-sender-service:
    image: martogr/mail_sender_service:v1
    container_name: mail-sender-ms
    healthcheck:
      test: "curl --fail --silent localhost:8082/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "mail_sender_service"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  gateway-service:
    image: martogr/gateway_service:v1
    container_name: gateway-service-ms
    ports:
      - "8090:8090"
    depends_on:
      mail-sender-service:
        condition: service_healthy
      item-service:
        condition: service_healthy
      bidding-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gateway_service"
      SPRING_DATA_REDIS_CONNECTTIMEOUT: 2s
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 1s
#      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK-SET-URI: "http://keycloak:8080/realms/master/protocol/openid-connect/certs"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

networks:
  bidding-network:
    driver: bridge

volumes:
  redis-data:
#  prometheus-data:
#  keycloak-data:
#  rabbitmq-data:
