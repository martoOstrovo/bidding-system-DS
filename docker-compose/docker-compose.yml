services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: [ "start-dev", "--import-realm" ]
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in docker-compose/.env}"
      KC_HOSTNAME: "http://localhost:8083"
      KC_HEALTH_ENABLED: "true"
      GATEWAY_OAUTH2_CLIENT_SECRET: "${GATEWAY_OAUTH2_CLIENT_SECRET:?Set GATEWAY_OAUTH2_CLIENT_SECRET in docker-compose/.env}"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: [ "CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    extends:
      file: common-config.yml
      service: network-deploy-service

  redis:
    image: redis
    container_name: redis-ratelimit-ms
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      timeout: 10s
      retries: 10
    volumes:
      - redis-data:/data
    extends:
      file: common-config.yml
      service: network-deploy-service

  config-service:
    image: martogr/config_service:v1
    container_name: config-service-ms
    ports:
      - "8070:8070"
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  eureka-service:
    image: martogr/eureka_service:v1
    container_name: eureka-service-ms
    ports:
      - "8071:8071"
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "eureka_service"
    extends:
      file: common-config.yml
      service: microservice-config-service-config


  bidding-service:
    image: martogr/bidding_service:v1
    container_name: bidding-ms
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    #      rabbit:
    #        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "bidding_service"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  item-service:
    image: martogr/item_service:v1
    container_name: item-ms
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "item_service"
    extends:
      file: common-config.yml
      service: microservice-eureka-config


  mail-sender-service:
    image: martogr/mail_sender_service:v1
    container_name: mail-sender-ms
    healthcheck:
      test: "curl --fail --silent localhost:8082/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "mail_sender_service"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  gateway-service:
    image: martogr/gateway_service:v1
    container_name: gateway-service-ms
    ports:
      - "8090:8090"
    depends_on:
      keycloak:
        condition: service_healthy
      mail-sender-service:
        condition: service_healthy
      item-service:
        condition: service_healthy
      bidding-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gateway_service"
      GATEWAY_OAUTH2_CLIENT_SECRET: "${GATEWAY_OAUTH2_CLIENT_SECRET:?Set GATEWAY_OAUTH2_CLIENT_SECRET in docker-compose/.env}"
      KEYCLOAK_BACKCHANNEL_URL: "http://keycloak:8080/realms/bidding"
      KEYCLOAK_ISSUER_URI: "http://localhost:8083/realms/bidding"
      KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/bidding/protocol/openid-connect/certs"
      # Docker's host-side address on bidding-network; override if the subnet changes.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTEDPROXIES: '${GATEWAY_TRUSTED_PROXIES:-127\.0\.0\.1|::1|172\.18\.0\.1}'
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_XFORWARDED_PREFIXAPPEND: "false"
      SPRING_DATA_REDIS_CONNECTTIMEOUT: 2s
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 1s
    extends:
      file: common-config.yml
      service: microservice-eureka-config

networks:
  bidding-network:
    driver: bridge

volumes:
  keycloak-data:
  redis-data:
#  prometheus-data:
#  rabbitmq-data:
