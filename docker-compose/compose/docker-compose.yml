services:

  #  ZA METRIKI
  read:
    image: grafana/loki:latest
    container_name: loki-read
    command: "-config.file=/etc/loki/config.yaml -target=read"
    ports:
      - "3101:3100"
      - "7946"
      - "9095"
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    depends_on:
      - minio
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    networks: &loki-dns
      bidding-network:
        aliases:
          - loki

  write:
    image: grafana/loki:latest
    container_name: loki-write
    command: "-config.file=/etc/loki/config.yaml -target=write"
    ports:
      - "3102:3100"
      - "7946"
      - "9095"
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    healthcheck:
      test: [ "CMD", "/usr/bin/loki", "-health" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 45s
    depends_on:
      - minio
    networks:
      <<: *loki-dns

  alloy:
    image: grafana/alloy:latest
    container_name: alloy
    volumes:
      - ../observability/alloy/alloy-local-config.yaml:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    command: run --server.http.listen-addr=0.0.0.0:12345 --storage.path=/var/lib/alloy/data /etc/alloy/config.alloy
    ports:
      - "12345:12345"
    depends_on:
      - gateway
    extends:
      file: common-config.yml
      service: network-deploy-service

  minio:
    image: minio/minio
    container_name: minio
    entrypoint:
      - sh
      - -euc
      - |
        mkdir -p /data/loki-data && \
        mkdir -p /data/loki-ruler && \
        minio server /data
    environment:
      - MINIO_ROOT_USER=loki
      - MINIO_ROOT_PASSWORD=supersecret
      - MINIO_PROMETHEUS_AUTH_TYPE=public
      - MINIO_UPDATE=off
    ports:
      - "9000"
    volumes:
      - ./.data/minio:/data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 15s
      timeout: 20s
      retries: 5
    extends:
      file: common-config.yml
      service: network-deploy-service

  prometheus:
    image: prom/prometheus:v3.8.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../observability/prometheus/prometheus.yaml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    extends:
      file: common-config.yml
      service: network-deploy-service

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    environment:
      - GF_PATHS_PROVISIONING=/etc/grafana/provisioning
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
    depends_on:
      - gateway
    entrypoint:
      - sh
      - -euc
      - |
        /run.sh
    ports:
      - "3000:3000"
    volumes:
      - ../observability/grafana/datasource.yaml:/etc/grafana/provisioning/datasources/datasource.yaml
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3000/api/health || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:
      file: common-config.yml
      service: network-deploy-service

  backend:
    image: grafana/loki:latest
    container_name: loki-backend
    volumes:
      - ../observability/loki/loki-config.yaml:/etc/loki/config.yaml
    ports:
      - "3100"
      - "7946"
    command: "-config.file=/etc/loki/config.yaml -target=backend -legacy-read-mode=false"
    depends_on:
      - gateway
    extends:
      file: common-config.yml
      service: network-deploy-service


  gateway:
    image: nginx:latest
    container_name: grafana-gateway
    depends_on:
      - read
      - write
    entrypoint:
      - sh
      - -euc
      - |
        cat <<EOF > /etc/nginx/nginx.conf
        user  nginx;
        worker_processes  5;  ## Default: 1
        events {
          worker_connections   1000;
        }

        http {
          resolver 127.0.0.11;

          server {
            listen             3100;

            location = / {
              return 200 'OK';
              auth_basic off;
            }

            location = /api/prom/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /api/prom/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /api/prom/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }

            location = /loki/api/v1/push {
              proxy_pass       http://write:3100\$$request_uri;
            }

            location = /loki/api/v1/tail {
              proxy_pass       http://read:3100\$$request_uri;
              proxy_set_header Upgrade \$$http_upgrade;
              proxy_set_header Connection "upgrade";
            }

            location ~ /loki/api/.* {
              proxy_pass       http://read:3100\$$request_uri;
            }
          }
        }
        EOF
        /docker-entrypoint.sh nginx -g "daemon off;"
    ports:
      - "3100:3100"
    healthcheck:
      test: [ "CMD", "service", "nginx", "status" ]
      interval: 10s
      timeout: 5s
      retries: 5
    extends:
      file: common-config.yml
      service: network-deploy-service
  #ZA METRIKI


  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    command: [ "start-dev", "--import-realm" ]
    ports:
      - "127.0.0.1:8083:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: "${KEYCLOAK_ADMIN_USERNAME:-admin}"
      KC_BOOTSTRAP_ADMIN_PASSWORD: "${KEYCLOAK_ADMIN_PASSWORD:?Set KEYCLOAK_ADMIN_PASSWORD in docker-compose/.env}"
      KC_HOSTNAME: "http://localhost:8083"
      KC_HEALTH_ENABLED: "true"
      GATEWAY_OAUTH2_CLIENT_SECRET: "${GATEWAY_OAUTH2_CLIENT_SECRET:?Set GATEWAY_OAUTH2_CLIENT_SECRET in docker-compose/.env}"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ../keycloak:/opt/keycloak/data/import:ro
    healthcheck:
      test: [ "CMD", "bash", "-ec", "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'GET /health/ready HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3; grep -q '200 OK' <&3" ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    extends:
      file: common-config.yml
      service: network-deploy-service

  redis:
    image: redis
    container_name: redis-ratelimit-ms
    ports:
      - "6379:6379"
    healthcheck:
      test: [ "CMD-SHELL", "redis-cli ping | grep PONG" ]
      timeout: 10s
      retries: 10
    volumes:
      - redis-data:/data
    extends:
      file: common-config.yml
      service: network-deploy-service

  config-service:
    image: martogr/config_service:v1
    container_name: config-service-ms
    ports:
      - "8070:8070"
    healthcheck:
      test: "curl --fail --silent localhost:8070/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    extends:
      file: common-config.yml
      service: microservice-base-config

  eureka-service:
    image: martogr/eureka_service:v1
    container_name: eureka-service-ms
    ports:
      - "8071:8071"
    depends_on:
      config-service:
        condition: service_healthy
    healthcheck:
      test: "curl --fail --silent localhost:8071/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    environment:
      SPRING_APPLICATION_NAME: "eureka_service"
    extends:
      file: common-config.yml
      service: microservice-config-service-config


  bidding-db:
    image: postgres:15-alpine
    container_name: bidding-db-ms
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: bidding_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d bidding_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - bidding-db-data:/var/lib/postgresql/data
    extends:
      file: common-config.yml
      service: network-deploy-service

  item-db:
    image: postgres:15-alpine
    container_name: item-db-ms
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: item_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres -d item_db" ]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - item-db-data:/var/lib/postgresql/data
    extends:
      file: common-config.yml
      service: network-deploy-service

  bidding-service:
    image: martogr/bidding_service:v1
    container_name: bidding-ms
    healthcheck:
      test: "curl --fail --silent localhost:8081/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      bidding-db:
        condition: service_healthy
#      rabbit:
#        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "bidding_service"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  item-service:
    image: martogr/item_service:v1
    container_name: item-ms
    healthcheck:
      test: "curl --fail --silent localhost:8080/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
      item-db:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "item_service"
      FILE_UPLOAD_DIR: "/data/images"
    volumes:
      - item-images:/data/images
    extends:
      file: common-config.yml
      service: microservice-eureka-config


  mail-sender-service:
    image: martogr/mail_sender_service:v1
    container_name: mail-sender-ms
    healthcheck:
      test: "curl --fail --silent localhost:8082/actuator/health/readiness | grep UP || exit 1"
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    depends_on:
      config-service:
        condition: service_healthy
      eureka-service:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "mail_sender_service"
      MAIL_USERNAME: "${MAIL_USERNAME:-}"
      MAIL_PASSWORD: "${MAIL_PASSWORD:-}"
    extends:
      file: common-config.yml
      service: microservice-eureka-config

  gateway-service:
    image: martogr/gateway_service:v1
    container_name: gateway-service-ms
    ports:
      - "8090:8090"
    depends_on:
      keycloak:
        condition: service_healthy
      mail-sender-service:
        condition: service_healthy
      item-service:
        condition: service_healthy
      bidding-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_APPLICATION_NAME: "gateway_service"
      GATEWAY_OAUTH2_CLIENT_SECRET: "${GATEWAY_OAUTH2_CLIENT_SECRET:?Set GATEWAY_OAUTH2_CLIENT_SECRET in docker-compose/.env}"
      KEYCLOAK_BACKCHANNEL_URL: "http://keycloak:8080/realms/bidding"
      KEYCLOAK_ISSUER_URI: "http://localhost:8083/realms/bidding"
      KEYCLOAK_JWK_SET_URI: "http://keycloak:8080/realms/bidding/protocol/openid-connect/certs"
      # Docker's host-side address on bidding-network; override if the subnet changes.
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_TRUSTEDPROXIES: '${GATEWAY_TRUSTED_PROXIES:-127\.0\.0\.1|::1|172\.18\.0\.1}'
      SPRING_CLOUD_GATEWAY_SERVER_WEBFLUX_XFORWARDED_PREFIXAPPEND: "false"
      SPRING_DATA_REDIS_CONNECTTIMEOUT: 2s
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_TIMEOUT: 1s
    extends:
      file: common-config.yml
      service: microservice-eureka-config

networks:
  bidding-network:
    driver: bridge

volumes:
  keycloak-data:
  redis-data:
  bidding-db-data:
  item-db-data:
  item-images:
  prometheus-data:
#  rabbitmq-data:
