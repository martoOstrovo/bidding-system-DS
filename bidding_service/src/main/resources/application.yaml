spring:
  application:
    name: bidding_service
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8070/}"

  datasource:
    url: jdbc:h2:mem:bidding_db
    driver-class-name: org.h2.Driver
    username: sa
    password: ''

  h2:
    console:
      enabled: true

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true

  cloud:
    openfeign:
      circuitbreaker:
        enabled: true

resilience4j:
  retry:
    configs:
      default:
        max-attempts: 3
        wait-duration: 500ms
        enable-exponential-backoff: true
        exponential-backoff-multiplier: 2
    instances:
      getItemRetry:
        base-config: default


